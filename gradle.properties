org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
# Run the Kotlin compiler inside the Gradle daemon: this machine has 6.9 GB of RAM
# and a separate Kotlin daemon pushes it into swap.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# Never let AGP try to install SDK packages itself: the 2026 command-line tools
# write repository XML v4 that older AGP versions cannot drive.
android.builder.sdkDownload=false

kotlin.code.style=official
